name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────────
  # Quality Gate: Trava de Diff Vazio
  # ──────────────────────────────────────────────────
  verify-diff:
    name: Verify Non-Empty Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          echo "Total de arquivos alterados: $CHANGED_FILES"
          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "❌ ERRO DevSecOps: Esta Pull Request possui um diff vazio (0 arquivos alterados)."
            echo "PRs sem alterações reais de código não são permitidas neste repositório."
            exit 1
          fi
          echo "✅ Validação QA: PR contém alterações de código válidas."

  # ──────────────────────────────────────────────────
  # Linting
  # ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Run NilAway
        run: make nilaway

  # ──────────────────────────────────────────────────
  # Tests (cross-platform)
  # ──────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: make test

  # ──────────────────────────────────────────────────
  # Fuzz Tests
  # ──────────────────────────────────────────────────
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run fuzz tests
        run: make fuzz

  # ──────────────────────────────────────────────────
  # Security Analysis (gosec)
  # ──────────────────────────────────────────────────
  security:
    name: Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run gosec
        run: make security

  # ──────────────────────────────────────────────────
  # Vulnerability Check (govulncheck)
  # ──────────────────────────────────────────────────
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run govulncheck
        run: make vulncheck
