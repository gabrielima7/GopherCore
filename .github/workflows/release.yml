name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────
  # Verify before release
  # ──────────────────────────────────────────────────
  verify:
    name: Verify (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Run go vet
        run: make vet

  # ──────────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x ./scripts/next-version.sh
          VERSION=$(./scripts/next-version.sh "$REF_TYPE" "$REF_NAME")
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IS_PRERELEASE=false
          if [ "$REF_TYPE" != "tag" ]; then
            IS_PRERELEASE=true
          fi
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          output-file: gophercore-sbom.spdx.json
          format: spdx-json

      - name: Package Release Distribution
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          tar -czf "/tmp/gophercore-${VERSION}.tar.gz" --exclude='.git' --exclude='.github' --exclude='gophercore-sbom.spdx.json' .
          mv "/tmp/gophercore-${VERSION}.tar.gz" "./gophercore-${VERSION}.tar.gz"

      - name: Generate checksums
        id: hash
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          sha256sum gophercore-sbom.spdx.json "gophercore-${VERSION}.tar.gz" > checksums.txt
          echo "hashes=$(cat checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: GopherCore ${{ steps.versioning.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.versioning.outputs.prerelease == 'true' }}
          files: |
            gophercore-${{ steps.versioning.outputs.version }}.tar.gz
            gophercore-sbom.spdx.json
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────
  # SLSA Provenance
  # ──────────────────────────────────────────────────
  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.release.outputs.version }}"

  # ──────────────────────────────────────────────────
  # Continuous Deployment (Protected Environment)
  # ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    environment: production
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Validate Deployment Gate
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "Deploying release $VERSION to production environment..."
          echo "Production deployment gate successfully validated."

      - name: Register on pkg.go.dev via Go Proxy
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "Registering module version $VERSION on proxy.golang.org and pkg.go.dev..."
          mkdir -p /tmp/proxy-warmup
          cd /tmp/proxy-warmup
          GOPROXY=https://proxy.golang.org go list -m "github.com/gabrielima7/GopherCore@${VERSION}" || true
